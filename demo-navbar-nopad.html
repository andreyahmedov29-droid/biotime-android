<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIOTIME — кнопки вверху без подложки (пример)</title>
<style>
  :root{
    --ink:#eef1f6; --ink-faint:#8b94a7; --accent:#ffab38;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font:14px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); min-height:100vh;
    /* Контрастный фон, чтобы было видно, что панели-подложки НЕТ */
    background:
      radial-gradient(600px 300px at 10% -10%, rgba(255,171,56,.4), transparent 60%),
      radial-gradient(700px 320px at 90% 0%, rgba(120,140,255,.4), transparent 55%),
      linear-gradient(160deg, #10131c 0%, #0b0d12 55%, #1a1220 100%);}

  /* Верхняя полоса БЕЗ фоновой подложки: прозрачный контейнер в одну строку */
  .topnav{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; flex-wrap:wrap;
    gap:18px; padding:18px 28px; max-width:1180px; margin:0 auto;
  }
  .brand{font-weight:700; letter-spacing:.3px; white-space:nowrap}

  /* Кнопки-разделы: только текст, БЕЗ фона/рамок/плашек */
  .nav{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
  .nav button{
    appearance:none; border:none; background:transparent; cursor:pointer;
    font:inherit; color:var(--ink-faint); padding:8px 6px; white-space:nowrap;
    border-bottom:2px solid transparent; border-radius:8px;
    transition:color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  /* Подсветка при наведении: тёплый полупрозрачный «блик» с мягким свечением,
     без постоянной плашки (это временный эффект наведения) */
  .nav button:hover{
    color:#fff;
    background:rgba(255,171,56,.14);
    box-shadow:0 0 0 1px rgba(255,171,56,.28), 0 6px 16px -8px rgba(255,171,56,.55);
    border-bottom-color:transparent;
  }
  .nav button.active{color:var(--ink);
    border-bottom-color:var(--accent); font-weight:600}

  .spacer{flex:1}
  .top-right{display:flex; align-items:center; gap:16px; white-space:nowrap}
  .user{color:var(--ink)}
  .user b{color:var(--ink-faint); font-weight:600}
  .date{color:var(--ink-faint)}

  .demo-hint{max-width:1180px; margin:8px auto; padding:0 28px; color:var(--ink-faint)}
</style>
</head>
<body>
  <header class="topnav">
    <div class="brand">БИОТАЙМ</div>
    <nav class="nav">
      <button>Таймер</button>
      <button>Зарплата</button>
      <button>Доставка</button>
      <button>В эфире</button>
      <button>Маршрутизация</button>
      <button>Мои маршруты</button>
      <button>Отгрузка</button>
      <button>Журнал</button>
      <button class="active">Отчёт</button>
    </nav>
    <div class="spacer"></div>
    <div class="top-right">
      <span class="user">Андрей Ахмедов</span>
      <span class="date">Вт, 8 Сентября</span>
    </div>
  </header>

  <div class="demo-hint">
    Кнопки разделов встроены в верх страницы без фоновой подложки: только текст.
    Активная вкладка выделена оранжевым подчёркиванием. Все разделы сохранены.
    Слева — название, справа — пользователь и дата (тоже без плашек).
  </div>
</body>
</html>

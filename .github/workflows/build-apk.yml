name: Build APK

# Собирает APK по кнопке (workflow_dispatch) и при пуше в main/master,
# публикует APK в GitHub Release для self-update.
on:
  push:
    branches: [main, master]
  workflow_dispatch: # ручной запуск: вкладка Actions ▸ "Build APK" ▸ Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Установить JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew (Linux)
        run: chmod +x gradlew

      - name: Собрать debug APK
        run: ./gradlew assembleDebug

      - name: Собрать release APK
        run: ./gradlew assembleRelease

      - name: Выгрузить APK как артефакт
        uses: actions/upload-artifact@v5
        with:
          name: biotime-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Публикуем release-APK в GitHub Release «biotime-apk-latest» — у него будет
      # прямая ссылка, которую приложение использует для self-update:
      #   https://github.com/<owner>/<repo>/releases/download/biotime-apk-latest/app-release.apk
      # Эту ссылку затем впишите в APP_UPDATE_APK_URL на сервере (см. README).
      - name: Опубликовать APK в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biotime-apk-latest
          name: BIOTIME APK (latest)
          body: |
            Автоматическая сборка APK.
            Ссылка для self-update:
            https://github.com/${{ github.repository }}/releases/download/biotime-apk-latest/app-release.apk
          files: app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      # Авто-оповещение сервера о новой версии APK для self-update.
      # Чтобы включить — задайте на GitHub два секрета (Settings ▸ Secrets ▸ Actions):
      #   SERVER_UPDATE_URL   — эндпоинт, который принимает POST {versionCode, versionName, apkUrl}
      #   SERVER_UPDATE_TOKEN — произвольный токен/секрет (передаётся заголовком X-Update-Token)
      # Если секреты не заданы — шаг БЕЗОПАСНО пропускается (сборка/публикация релиза уже прошли).
      - name: Оповестить сервер о новой версии APK
        env:
          SERVER_UPDATE_URL: ${{ secrets.SERVER_UPDATE_URL }}
          SERVER_UPDATE_TOKEN: ${{ secrets.SERVER_UPDATE_TOKEN }}
        run: |
          if [ -z "$SERVER_UPDATE_URL" ] || [ -z "$SERVER_UPDATE_TOKEN" ]; then
            echo "::warning::Секреты SERVER_UPDATE_URL/SERVER_UPDATE_TOKEN не заданы — пропускаем оповещение сервера."
            exit 0
          fi
          VC=$(sed -n 's/.*versionCode = \(.*\)/\1/p' app/build.gradle.kts | tr -d ' \r')
          VN=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | tr -d ' \r')
          APK_URL="https://github.com/${{ github.repository }}/releases/download/biotime-apk-latest/app-release.apk"
          echo "Извещаем сервер: versionCode=$VC versionName=$VN"
          curl -sS -X POST "$SERVER_UPDATE_URL" \
            -H "Content-Type: application/json" \
            -H "X-Update-Token: $SERVER_UPDATE_TOKEN" \
            --data "{\"versionCode\":$VC,\"versionName\":\"$VN\",\"apkUrl\":\"$APK_URL\"}"

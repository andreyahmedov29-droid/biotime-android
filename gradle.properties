# JVM память для Gradle-демона
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Не выполнять Unit-тесты на устройстве
android.nonTransitiveRClass=true

# AGP 8.5.2 протестирован до compileSdk 34; подавляем предупреждение о compileSdk 35
# (проект намеренно использует targetSdk 35). Не влияет на поведение сборки.
android.suppressUnsupportedCompileSdk=35
